<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Field Walk</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  --slate: #1c262c; --slate2: #26333b; --ink: #eef2f3; --dim: #9fb0b9; --vis: #ff7a1a; --sky: #c9d1d5; }
html, body { height: 100%; margin: 0; background: var(--sky); overflow: hidden; font-family: "Barlow", "Segoe UI", system-ui, sans-serif; color: var(--ink); }
[hidden] { display: none !important; }
#stage { position: fixed; inset: 0; } #stage canvas { display: block; touch-action: none; }
header { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 12px); left: 12px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; max-width: calc(100% - 24px); }
@media (min-width: 701px) { header { max-width: calc(100% - min(500px, 42vw) - 36px); } body:has(#panel.closed) header { max-width: calc(100% - 24px); } }
.chip { background: var(--slate); border-radius: 12px; padding: 10px 14px; line-height: 1.2; }
.chip b { font-size: 20px; letter-spacing: .01em; } .chip span { display: block; font-size: 13px; color: var(--dim); }
button.hud, a.hud { text-decoration: none; display: inline-block; }
button.hud, a.hud { font: 600 16px/1 "Barlow", system-ui, sans-serif; border: 0; border-radius: 12px; padding: 13px 16px; cursor: pointer; background: var(--slate2); color: var(--ink); }
button.hud:focus-visible { outline: 3px solid var(--vis); outline-offset: 2px; }
#vr { background: var(--vis); color: #1a1a1a; } #vr:disabled { background: var(--slate2); color: var(--dim); cursor: default; }
#panel { position: fixed; right: 12px; top: calc(env(safe-area-inset-top, 0px) + 12px); width: min(500px, 42vw); max-height: calc(100% - 24px); overflow-y: auto; transition: transform .2s; }
#panel canvas { width: 100%; height: auto; display: block; border-radius: 12px; }
#panel.closed { transform: translateX(calc(100% + 24px)); }
#moves { position: fixed; left: 12px; bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); display: none; grid-template-columns: repeat(3, 56px); gap: 8px; }
#moves button { height: 56px; font-size: 20px; padding: 0; }
.chip.iso { border-left: 6px solid #e8a317; } .chip.iso b { font-size: 15px; font-weight: 700; }
#ask { position: fixed; inset: 0; background: rgba(15,20,24,.55); display: grid; place-items: center; z-index: 20; }
#ask[hidden] { display: none; }
.askbox { background: var(--slate); border-radius: 14px; padding: 18px; width: min(440px, 92vw); display: grid; gap: 12px; }
.askbox label { font-weight: 700; font-size: 18px; }
.askbox input { font: 500 17px "Barlow", system-ui, sans-serif; padding: 12px; border-radius: 10px; border: 1px solid #3a4a54; background: #121a1f; color: var(--ink); }
.askbox input:focus-visible { outline: 3px solid var(--vis); }
.askrow { display: flex; gap: 10px; justify-content: flex-end; } #askOk { background: var(--vis); color: #1a1a1a; }
#toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 24px); transform: translate(-50%, 20px); opacity: 0; background: var(--slate); padding: 12px 18px; border-radius: 12px; font-weight: 600; transition: .2s; pointer-events: none; max-width: 90vw; text-align: center; }
#toast.on { opacity: 1; transform: translate(-50%, 0); }
#loading { position: fixed; inset: 0; display: grid; place-items: center; background: var(--sky); color: var(--slate); font: 600 22px "Barlow", system-ui, sans-serif; }
@media (pointer: coarse) { #moves { display: grid; } }
@media (max-width: 700px) {
  #panel { top: auto; bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); right: 12px; left: 12px; width: auto; max-height: 52vh; }
  #panel:not(.closed) ~ #moves { display: none; }
  #panel.closed { transform: translateX(calc(100% + 24px)); }
  #moves { grid-template-columns: repeat(3, 46px); } #moves button { height: 46px; }
  .chip span { display: none; }
}
@media (prefers-reduced-motion: reduce) { #panel, .chip.iso { border-left: 6px solid #e8a317; } .chip.iso b { font-size: 15px; font-weight: 700; }
#ask { position: fixed; inset: 0; background: rgba(15,20,24,.55); display: grid; place-items: center; z-index: 20; }
#ask[hidden] { display: none; }
.askbox { background: var(--slate); border-radius: 14px; padding: 18px; width: min(440px, 92vw); display: grid; gap: 12px; }
.askbox label { font-weight: 700; font-size: 18px; }
.askbox input { font: 500 17px "Barlow", system-ui, sans-serif; padding: 12px; border-radius: 10px; border: 1px solid #3a4a54; background: #121a1f; color: var(--ink); }
.askbox input:focus-visible { outline: 3px solid var(--vis); }
.askrow { display: flex; gap: 10px; justify-content: flex-end; } #askOk { background: var(--vis); color: #1a1a1a; }
#toast { transition: none; } }
</style>
</head>
<body>
<div id="stage"></div>
<header>
  <a class="hud" id="home" href="index.html" hidden>← Projects</a>
  <div class="chip"><b>Field Walk</b><span id="status">Loading</span></div>
  <div class="chip iso" id="iso"></div>
  <button class="hud" id="vr" disabled>Checking for headset</button>
  <button class="hud" id="togglePanel">Hide panel</button>
</header>
<div id="panel"></div>
<div id="moves" aria-label="Walk controls">
  <button class="hud" data-move="e" aria-label="Fly up">⤒</button><button class="hud" data-move="w" aria-label="Walk forward">▲</button><button class="hud" data-move="q" aria-label="Fly down">⤓</button>
  <button class="hud" data-move="a" aria-label="Step left">◀</button><button class="hud" data-move="s" aria-label="Walk back">▼</button><button class="hud" data-move="d" aria-label="Step right">▶</button>
</div>
<div id="toast" role="status"></div>
<div id="ask" hidden><div class="askbox"><label id="askLabel" for="askInput">Note</label><input id="askInput" type="text" maxlength="200" autocomplete="off">
<div class="askrow"><button class="hud" id="askCancel">Cancel</button><button class="hud" id="askOk">Save</button></div></div></div>
<div id="loading">Loading project</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
<script id="model" type="application/json"></script>
<script id="chunks" type="application/json">{}</script>
<script>/* Field Walk: WebXR BIM walkthrough with clash review and model edits.
   Loads a project built by add_project.py: either embedded (#model JSON) or from projects/<id>/ via viewer.html?p=<id>. */
(async () => {
'use strict';
const $ = (s) => document.querySelector(s);
const status = (t) => { $('#status').textContent = t; };

// ---------------------------------------------------------------- data (manifest + per-level chunks)
const PROJECT_ID = new URLSearchParams(location.search).get('p');
const EMBEDDED = ($('#model') || {}).textContent || '';
const BASE = EMBEDDED.trim() ? '' : `projects/${encodeURIComponent(PROJECT_ID || '')}/`;
let PKG;
try {
  if (EMBEDDED.trim()) PKG = JSON.parse(EMBEDDED);
  else {
    if (!PROJECT_ID) { location.replace('index.html'); return; }
    const r = await fetch(BASE + 'manifest.json'); if (!r.ok) throw new Error(r.status);
    PKG = await r.json();
  }
} catch (err) {
  $('#loading').innerHTML = `Could not load project "${String(PROJECT_ID || '').replace(/[<>&"]/g, '')}". <a href="index.html">Back to projects</a>`; return;
}
const TITLE = PKG.title || 'Project', SLUG = (PKG.slug || TITLE).replace(/[^A-Za-z0-9-]+/g, '-');
document.title = `Field Walk: ${TITLE}`;
if (!EMBEDDED.trim() && $('#home')) $('#home').hidden = false;
const CHUNK_URLS = JSON.parse(($('#chunks') || { textContent: '{}' }).textContent || '{}');
const E = new Array(PKG.count);        // filled as levels load
const LOADED = [];                     // loaded elements, for iteration
const [LO, HI] = PKG.building;
const LEVELS = PKG.levels;
const LEV = Object.fromEntries(LEVELS.map(l => [l.id, l]));
const b64 = (s, T) => { const bin = atob(s); const u8 = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i); return new T(u8.buffer); };

// Architecture stays in neutral greys so the MEP systems carry the colour.
// MEP follows the utility colour code (APWA-style, telecom in yellow as requested).
const CATS = [
  { id: 'structure', label: 'Structure',             color: 0xa39e96 },
  { id: 'wall',      label: 'Walls',                 color: 0xdcd9d2 },
  { id: 'curtain',   label: 'Curtain wall',          color: 0xb3b8ba },
  { id: 'opening',   label: 'Doors & windows',       color: 0xbfb6a8 },
  { id: 'ceiling',   label: 'Ceilings',              color: 0xe8e6e1 },
  { id: 'furniture', label: 'Furniture',             color: 0xa8927a },
  { id: 'archmisc',  label: 'Other arch',            color: 0xc9c4ba },
  { id: 'hvac',      label: 'HVAC & mechanical',     color: 0x1fc2b4, mep: true },
  { id: 'potable',   label: 'Potable water',         color: 0x1f6fe0, mep: true },
  { id: 'sewer',     label: 'Sewer & drainage',      color: 0x2e9e44, mep: true },
  { id: 'reclaimed', label: 'Reclaimed water',       color: 0x8a4fd6, mep: true },
  { id: 'gas',       label: 'Gas & petroleum',       color: 0xf2c52e, mep: true },
  { id: 'fire',      label: 'Fire protection',       color: 0xd62a1e, mep: true },
  { id: 'elec',      label: 'Electrical',            color: 0xe0321f, mep: true },
  { id: 'telecom',   label: 'Telecommunications',    color: 0xf5cf2a, mep: true },
  { id: 'plumbother',label: 'Other plumbing',        color: 0x7d8f9c, mep: true },
  { id: 'survey',    label: 'Survey markings',       color: 0xf36fb2 },
  { id: 'excavation',label: 'Proposed excavation',   color: 0xfafaf7 },
  { id: 'site',      label: 'Site',                  color: 0x9a9585 },
];
const CAT_OVERRIDE = PKG.catOverride || {};
const LEGACY_CAT = { duct: 'hvac', pipe: 'plumbother' };
// only list layers the model actually contains
const PRESENT = new Set(Object.keys(PKG.catCounts || {}));
const LAYERS = () => CATS.filter(c => !PKG.catCounts || PRESENT.has(c.id));
const CAT = Object.fromEntries(CATS.map(c => [c.id, c]));
const DISC = { arch: 'Architecture', struct: 'Structure', hvac: 'HVAC', plumb: 'Plumbing', elec: 'Electrical', site: 'Site' };
const catMode = Object.fromEntries(CATS.map(c => [c.id, 'solid']));
const levelOn = Object.fromEntries(LEVELS.map(l => [l.id, true]));
const levelState = Object.fromEntries(LEVELS.map(l => [l.id, 'idle']));

// ---------------------------------------------------------------- three setup
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.xr.enabled = true;
renderer.xr.setReferenceSpaceType('local-floor');
renderer.xr.setFoveation(1);
$('#stage').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xc9d1d5);
scene.add(new THREE.HemisphereLight(0xf4f6f7, 0x6b6456, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 1.4); sun.position.set(30, 80, 50); scene.add(sun);

const rig = new THREE.Group(); scene.add(rig);
const camera = new THREE.PerspectiveCamera(65, innerWidth / innerHeight, 0.05, 2000);
camera.position.set(0, 1.65, 0); rig.add(camera);
const world = new THREE.Group(); scene.add(world);

const solidMat = {}, xrayMat = {};
for (const c of CATS) {
  solidMat[c.id] = new THREE.MeshStandardMaterial({ color: c.color, roughness: 0.85, flatShading: true, side: THREE.DoubleSide });
  xrayMat[c.id] = new THREE.MeshStandardMaterial({ color: c.color, roughness: 0.85, flatShading: true, side: THREE.DoubleSide,
    transparent: true, opacity: 0.1, depthWrite: false });
}
// selected elements draw on top so they stay visible through walls
// The selected pair is drawn in a second pass after the depth buffer is cleared: it shows through
// walls and slabs, but the two elements still hide each other correctly, so the clash reads the
// same from every angle. The partner is semi-transparent so you can see the selected run pass through it.
const selMat = new THREE.MeshStandardMaterial({ color: 0xff7a1a, emissive: 0x7a2c00, flatShading: true, side: THREE.DoubleSide });
const partnerMat = new THREE.MeshStandardMaterial({ color: 0xffc27a, emissive: 0x6a3a00, flatShading: true, side: THREE.DoubleSide,
  transparent: true, opacity: 0.45, depthWrite: false });
const overlay = new THREE.Scene();
overlay.add(new THREE.HemisphereLight(0xf4f6f7, 0x6b6456, 1.6));
const sun2 = sun.clone(); overlay.add(sun2);
const overlayRoot = new THREE.Group(); overlay.add(overlayRoot);
function renderFrame() {
  overlayRoot.position.copy(world.position); overlayRoot.quaternion.copy(world.quaternion); overlayRoot.scale.copy(world.scale);
  renderer.autoClear = true;
  renderer.render(scene, camera);
  if (overlayRoot.children.length) {
    renderer.autoClear = false; renderer.clearDepth();
    renderer.render(overlay, camera);
    renderer.autoClear = true;
  }
}

// ---------------------------------------------------------------- level loading (one draw call per level x category)
const batches = [];                    // every batch, for layer changes
const levelLoads = {};
function chunkUrl(l) { return CHUNK_URLS[l.id] || (BASE + 'levels/' + l.file); }
function loadLevel(id) {
  if (levelLoads[id]) return levelLoads[id];
  const l = LEV[id]; levelState[id] = 'loading'; drawUI(); updateStatus();
  levelLoads[id] = fetch(chunkUrl(l)).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(ch => { buildLevel(ch); levelState[id] = 'ready'; applyPendingEdits(); if (fieldMode) applyFieldLOD(); applyLevel(id); if (clashOnly !== 'off') rebuildClashSet(); refreshMarkers(); drawUI(); updateStatus(); })
    .catch(err => { levelState[id] = 'error'; delete levelLoads[id]; toast(`Could not load ${l.label}`); drawUI(); updateStatus(); console.error(err); });
  return levelLoads[id];
}
function buildLevel(ch) {
  const Q = b64(ch.pos, Uint16Array), QI = b64(ch.idx, Uint16Array);
  const lo = ch.lo, sc = [0, 1, 2].map(k => (ch.hi[k] - ch.lo[k]) / 65535);
  const groups = {};
  for (const e of ch.els) { e.cat = CAT_OVERRIDE[e.i] || LEGACY_CAT[e.cat] || e.cat; (groups[e.cat] = groups[e.cat] || []).push(e); }
  for (const [cat, els] of Object.entries(groups)) {
    const nv = els.reduce((s, e) => s + e.vn, 0), ni = els.reduce((s, e) => s + e.tn, 0);
    const b = { cat, level: ch.level, pos: new Float32Array(nv * 3), idx: new Uint32Array(ni), els: [] };
    let vo = 0, io = 0;
    for (const e of els) {
      Object.assign(e, { lev: ch.level, b, bv: vo, bi: io, offset: new THREE.Vector3(), box: new THREE.Box3(),
        hidden: false, deleted: false, mesh: null, inBatch: true });
      for (let v = 0; v < e.vn; v++) for (let k = 0; k < 3; k++) b.pos[(vo + v) * 3 + k] = lo[k] + Q[(e.v0 + v) * 3 + k] * sc[k];
      const p = b.pos.subarray(vo * 3, (vo + e.vn) * 3);
      let x0 = Infinity, y0 = Infinity, z0 = Infinity, x1 = -Infinity, y1 = -Infinity, z1 = -Infinity;
      for (let n = 0; n < p.length; n += 3) { x0 = Math.min(x0, p[n]); x1 = Math.max(x1, p[n]); y0 = Math.min(y0, p[n + 1]); y1 = Math.max(y1, p[n + 1]); z0 = Math.min(z0, p[n + 2]); z1 = Math.max(z1, p[n + 2]); }
      e.box.min.set(x0, y0, z0); e.box.max.set(x1, y1, z1);
      for (let t = 0; t < e.tn; t++) b.idx[io + t] = QI[e.t0 + t] + vo;
      vo += e.vn; io += e.tn;
      E[e.i] = e; LOADED.push(e); b.els.push(e.i);
    }
    b.orig = b.idx.slice();
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(b.pos, 3));
    g.setIndex(new THREE.BufferAttribute(b.idx, 1));
    g.computeBoundingSphere();
    b.mesh = new THREE.Mesh(g, solidMat[cat]);
    world.add(b.mesh); batches.push(b);
  }
}
function styleBatch(b) {
  const mode = catMode[b.cat];
  b.mesh.visible = mode !== 'off' && levelOn[b.level];
  b.mesh.material = mode === 'xray' ? xrayMat[b.cat] : solidMat[b.cat];
  b.mesh.renderOrder = mode === 'xray' ? 2 : 0;
}
function applyLevel(id) {
  for (const b of batches) if (b.level === id) { styleBatch(b); for (const i of b.els) if (E[i].mesh) sync(i); }
}
function setLevel(id, on) {
  levelOn[id] = on;
  if (on && levelState[id] !== 'ready') loadLevel(id);
  applyLevel(id); if (typeof clashOnly !== 'undefined' && clashOnly !== 'off') rebuildClashSet(); refreshMarkers(); drawUI();
}
function onlyLevel(id) { for (const l of LEVELS) setLevel(l.id, l.id === id); }
function updateStatus() {
  const loading = LEVELS.filter(l => levelState[l.id] === 'loading').map(l => l.label);
  status(loading.length ? `Loading ${loading.join(', ')}` : `${LOADED.length.toLocaleString()} elements loaded, ${PKG.clashes.length.toLocaleString()} clashes`);
}

function setBatchVisible(e, vis) {
  const b = e.b, a = b.mesh.geometry.index;
  if (vis) b.idx.set(b.orig.subarray(e.bi, e.bi + e.tn), e.bi);
  else b.idx.fill(b.orig[e.bi], e.bi, e.bi + e.tn); // collapse to degenerate triangles
  a.updateRange.offset = e.bi; a.updateRange.count = e.tn; a.needsUpdate = true;
}

// ---------------------------------------------------------------- element state
let sel = -1, partner = -1;
const moved = (e) => e.offset.lengthSq() > 1e-8;

function extractGeometry(e) {
  const b = e.b;
  const pos = b.pos.slice(e.bv * 3, (e.bv + e.vn) * 3);
  const idx = new Uint16Array(e.tn);
  for (let t = 0; t < e.tn; t++) idx[t] = b.orig[e.bi + t] - e.bv;
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setIndex(new THREE.BufferAttribute(idx, 1));
  return g;
}

function sync(i) {
  if (i < 0 || !E[i]) return;
  const e = E[i];
  const gone = e.hidden || e.deleted || e.lod;
  const wantMesh = !gone && (i === sel || i === partner || moved(e));
  if (wantMesh && !e.mesh) { e.mesh = new THREE.Mesh(extractGeometry(e)); world.add(e.mesh); }
  if (!wantMesh && e.mesh) { e.mesh.parent.remove(e.mesh); e.mesh.geometry.dispose(); e.mesh = null; }
  const inBatch = !gone && !e.mesh;
  if (inBatch !== e.inBatch) { setBatchVisible(e, inBatch); e.inBatch = inBatch; }
  if (e.mesh) {
    e.mesh.position.copy(e.offset);
    const mode = catMode[e.cat];
    e.mesh.material = i === sel ? selMat : i === partner ? partnerMat : mode === 'xray' ? xrayMat[e.cat] : solidMat[e.cat];
    e.mesh.visible = i === sel || i === partner || (mode !== 'off' && levelOn[e.lev]);
    e.mesh.renderOrder = i === partner ? 2 : 0;
    const home = i === sel || i === partner ? overlayRoot : world;
    if (e.mesh.parent !== home) home.add(e.mesh);
  }
}

function select(i, p = -1) {
  const old = [sel, partner];
  sel = i; partner = p;
  old.forEach(sync); sync(sel); sync(partner);
  if (typeof refreshMarkers === 'function' && markers.hard) refreshMarkers();
  if (sel >= 0) { ui.tab = p >= 0 ? 'clashes' : 'element'; ui.scroll = 0; }
  drawUI();
}

function setCatMode(id, mode) {
  catMode[id] = mode;
  for (const b of batches) if (b.cat === id) { styleBatch(b); for (const i of b.els) if (E[i].mesh) sync(i); }
  drawUI();
}

// ---------------------------------------------------------------- edits, undo, issues
const undoStack = [];
const issues = [];
function pushUndo(i) { const e = E[i]; undoStack.push({ i, hidden: e.hidden, deleted: e.deleted, offset: e.offset.clone() }); }
function undo() {
  const u = undoStack.pop(); if (!u) return;
  const e = E[u.i]; e.hidden = u.hidden; e.deleted = u.deleted; e.offset.copy(u.offset); sync(u.i); afterMove(u.i); drawUI();
}
function hideSel() { if (sel < 0) return; pushUndo(sel); E[sel].hidden = true; const i = sel; select(-1); sync(i); }
function deleteSel() { if (sel < 0 || locked()) return; pushUndo(sel); E[sel].deleted = true; const i = sel; select(-1); sync(i); }
function nudge(axis, d) { if (sel < 0 || locked()) return; pushUndo(sel); E[sel].offset.setComponent(axis, E[sel].offset.getComponent(axis) + d); sync(sel); afterMove(sel); drawUI(); }
function showAllHidden() { for (const e of LOADED) if (e.hidden) { e.hidden = false; sync(e.i); } drawUI(); }
let isolated = null;
function toggleIsolate() {
  if (isolated) { for (const c of CATS) setCatMode(c.id, isolated[c.id]); isolated = null; }
  else if (sel >= 0) { isolated = { ...catMode }; for (const c of CATS) setCatMode(c.id, 'xray'); }
  drawUI();
}

function viewCamera() {
  const cam = renderer.xr.isPresenting ? renderer.xr.getCamera() : camera;
  const p = new THREE.Vector3(), d = new THREE.Vector3();
  cam.getWorldPosition(p); cam.getWorldDirection(d);
  const inv = world.matrixWorld.clone().invert();
  p.applyMatrix4(inv); d.transformDirection(inv);
  return { p, d };
}
function flag(kind, ids, title, description, clashK = -1) {
  issues.push({ kind, ids, title, description, clashK, cam: viewCamera(), date: new Date().toISOString() });
  toast(`Flagged: ${title}`); refreshMarkers(); drawUI();
}
const isFlagged = (k) => issues.some(x => x.clashK === k);
function unflagClash(k) {
  for (let n = issues.length - 1; n >= 0; n--) if (issues[n].clashK === k) issues.splice(n, 1);
  toast('Flag removed'); refreshMarkers(); drawUI();
}
// ---------------------------------------------------------------- session: ISO 19650 status, reviewer roles, field mode, structured issues
// Suitability codes follow the UK National Annex to ISO 19650-2 (the most widely used code set).
const ISO_STATES = {
  WIP:       { label: 'Work in progress', codes: ['S0'], color: '#8a969c' },
  Shared:    { label: 'Shared', codes: ['S1', 'S2', 'S3', 'S4'], color: '#e8a317' },
  Published: { label: 'Published', codes: ['A1', 'A2', 'A3', 'B1'], color: '#3fb950' },
  Archived:  { label: 'Archived', codes: ['—'], color: '#6d7c85' },
};

  const cands = [];
  for (const e of LOADED) {
    if (e.hidden || e.deleted || e.lod || !levelOn[e.lev]) continue;
    const mode = catMode[e.cat];
    if (mode !== 'solid' && e.i !== sel && e.i !== partner && !clashSet.has(e.i)) continue; // see-through layers are not pickable, except clash elements in Clashes only
    _box.copy(e.box).translate(e.offset);
    const h = ray.intersectBox(_box, _hit);
    if (h) cands.push([ray.origin.distanceTo(h), e]);
  }
  cands.sort((x, y) => x[0] - y[0]);
  let best = Infinity, bestI = -1;
  for (const [d0, e] of cands) {
    if (d0 > best) break;
    const b = e.b, P = b.pos, I = b.orig, o = e.offset;
    for (let t = 0; t < e.tn; t += 3) {
      const i0 = I[e.bi + t] * 3, i1 = I[e.bi + t + 1] * 3, i2 = I[e.bi + t + 2] * 3;
      _a.set(P[i0] + o.x, P[i0 + 1] + o.y, P[i0 + 2] + o.z);
      _b.set(P[i1] + o.x, P[i1 + 1] + o.y, P[i1 + 2] + o.z);
      _c.set(P[i2] + o.x, P[i2 + 1] + o.y, P[i2 + 2] + o.z);
      if (ray.intersectTriangle(_a, _b, _c, false, _hit)) {
        const d = ray.origin.distanceTo(_hit); if (d < best) { best = d; bestI = e.i; }
      }
    }
  }
  return bestI;
}

function rr(x, y, w, h, r, fill, stroke) {
  ctx.beginPath(); ctx.roundRect(x, y, w, h, r);

}
function text(s, x, y, size = 30, color = C.ink, weight = 500, align = 'left', maxW = 0) {
  ctx.font = `${weight} ${size}px ${FONT}`; ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = 'middle';
  s = String(s);

}
function button(id, x, y, w, h, label, onClick, opt = {}) {
  const hot = ui.hover === id;

}
function wrap(s, maxW, size, weight = 600) {
  ctx.font = `${weight} ${size}px ${FONT}`;
  const words = String(s).split(/\s+/), lines = []; let cur = '';
  for (const w of words) { const t = cur ? cur + ' ' + w : w; if (ctx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; }
  if (cur) lines.push(cur); return lines;
}

function para(s, x, y, maxW, size = 27, color = C.dim) {
  const lines = wrap(s, maxW, size, 500);
  lines.forEach((l, n) => text(l, x, y + n * size * 1.35, size, color, 500));
  return y + lines.length * size * 1.35;
}

// ---- snapshots: render the clash pair from a fixed diagonal and grab the canvas in the same task
const snapCam = new THREE.PerspectiveCamera(50, 1.6, 0.05, 2000);

async function snapshot(c, type = 'image/jpeg') {
  if (renderer.xr.isPresenting) return null;
  await Promise.all([loadLevel(c.la), loadLevel(c.lb)]);

  const prevSel = sel, prevPartner = partner, prevLev = { ...levelOn };
  for (const id of [c.la, c.lb]) if (!levelOn[id]) { levelOn[id] = true; applyLevel(id); }
  sel = c.a; partner = c.b; [prevSel, prevPartner, c.a, c.b].forEach(sync);
  // architecture goes see-through for the snapshot so façades and walls don't hide the pair's surroundings
  const prevCat = { ...catMode };
  for (const id of ['wall', 'curtain', 'opening', 'ceiling', 'furniture', 'archmisc']) if (catMode[id] === 'solid') catMode[id] = 'xray';
  catMode.site = 'off'; batches.forEach(styleBatch);
  const box = E[c.a].box.clone().union(E[c.b].box), size = box.getSize(new THREE.Vector3());
  const target = new THREE.Vector3(...c.at);
  const dist = Math.min(10, Math.max(1.6, Math.max(size.x, size.y, size.z) * 0.45 + 1.2));
  world.updateMatrixWorld();
  const tw = target.clone().applyMatrix4(world.matrixWorld);
  snapCam.position.copy(tw).addScaledVector(new THREE.Vector3(0.75, 0.55, 0.75).normalize(), dist * world.scale.x);
  snapCam.lookAt(tw); snapCam.aspect = renderer.domElement.width / renderer.domElement.height;
  snapCam.updateProjectionMatrix(); snapCam.updateMatrixWorld();
  overlayRoot.position.copy(world.position); overlayRoot.quaternion.copy(world.quaternion); overlayRoot.scale.copy(world.scale);
  renderer.autoClear = true; renderer.render(scene, snapCam);
  renderer.autoClear = false; renderer.clearDepth(); renderer.render(overlay, snapCam); renderer.autoClear = true;
  // crop the centre of the frame to 16:10
  const src = renderer.domElement, sw = src.width, sh = src.height, want = 1.6;

  const g = snapCv.getContext('2d');
  g.drawImage(src, (sw - cw) / 2, (sh - ch) / 2, cw, ch, 0, 0, snapCv.width, snapCv.height);

  sel = prevSel; partner = prevPartner; [c.a, c.b, prevSel, prevPartner].forEach(sync);
  for (const l of LEVELS) if (levelOn[l.id] !== prevLev[l.id]) { levelOn[l.id] = prevLev[l.id]; applyLevel(l.id); }

}
const dataUrlBytes = (u) => b64(u.split(',')[1], Uint8Array);

// ---- BCF 2.1
async function exportBCF() {

  const topics = allTopics();

  const files = [['bcf.version', '<?xml version="1.0" encoding="UTF-8"?>\n<Version VersionId="2.1"><DetailedVersion>2.1</DetailedVersion></Version>']];
  for (const t of topics) {
    const tg = uuid(), vg = uuid();
    const c = t.clashK >= 0 ? { ...PKG.clashes[t.clashK], k: t.clashK } : null;
    let cam = t.cam, snap = null;

<Markup><Topic Guid="${tg}" TopicType="${xml(t.kind)}" TopicStatus="${status}"><Title>${xml(title)}</Title>${t.priority ? `<Priority>${xml(t.priority)}</Priority>` : ''}
${[t.trade, t.objective, t.role].filter(Boolean).map(l => `<Labels>${xml(l)}</Labels>`).join('')}

<Viewpoints Guid="${vg}"><Viewpoint>viewpoint.bcfv</Viewpoint>${snap ? '<Snapshot>snapshot.png</Snapshot>' : ''}</Viewpoints></Markup>`]);

<Visibility DefaultVisibility="true"/></Components><PerspectiveCamera>
<CameraViewPoint><X>${px.toFixed(4)}</X><Y>${py.toFixed(4)}</Y><Z>${pz.toFixed(4)}</Z></CameraViewPoint>
<CameraDirection><X>${dx.toFixed(5)}</X><Y>${dy.toFixed(5)}</Y><Z>${dz.toFixed(5)}</Z></CameraDirection>
<CameraUpVector><X>0</X><Y>0</Y><Z>1</Z></CameraUpVector><FieldOfView>60</FieldOfView></PerspectiveCamera></VisualizationInfo>`]);

function exportJSON() {

// ---- store-only zip with valid DOS timestamps (an all-zero date trips some .NET readers used by Revit add-ins)
const CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();

    dosDate = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();

    const nb = enc.encode(name), data = body instanceof Uint8Array ? body : enc.encode(body), crc = crc32(data);
    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true); // UTF-8 names
    h.setUint16(10, dosTime, true); h.setUint16(12, dosDate, true); h.setUint32(14, crc, true);
    h.setUint32(18, data.length, true); h.setUint32(22, data.length, true); h.setUint16(26, nb.length, true);
    parts.push(new Uint8Array(h.buffer), nb, data);
    const c = new DataView(new ArrayBuffer(46));
    c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true);
    c.setUint16(12, dosTime, true); c.setUint16(14, dosDate, true); c.setUint32(16, crc, true);
    c.setUint32(20, data.length, true); c.setUint32(24, data.length, true); c.setUint16(28, nb.length, true); c.setUint32(42, off, true);
    cen.push(new Uint8Array(c.buffer), nb);
    off += 30 + nb.length + data.length;
  }
  const cs = cen.reduce((s, a) => s + a.length, 0), end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);

let downloads = null;

let toastT = 0;

// ---------------------------------------------------------------- screen controls
const panelEl = $('#panel');
panelEl.appendChild(ui.cv);
function panelHit(ev) {
  const r = ui.cv.getBoundingClientRect();
  const x = (ev.clientX - r.left) / r.width * ui.cv.width, y = (ev.clientY - r.top) / r.height * ui.cv.height;
  return ui.regions.find(g => x >= g.x && x <= g.x + g.w && y >= g.y && y <= g.y + g.h);
}
ui.cv.addEventListener('pointermove', (ev) => { const g = panelHit(ev); const id = g ? g.id : null; if (id !== ui.hover) { ui.hover = id; drawUI(); } ui.cv.style.cursor = g ? 'pointer' : 'default'; });

let pitch = 0, drag = null;

const cv = renderer.domElement;
cv.addEventListener('pointerdown', (ev) => { drag = { x: ev.clientX, y: ev.clientY, sx: ev.clientX, sy: ev.clientY, id: ev.pointerId }; cv.setPointerCapture(ev.pointerId); });
cv.addEventListener('pointermove', (ev) => {
  if (!drag || drag.id !== ev.pointerId) return;
  const dx = ev.clientX - drag.x, dy = ev.clientY - drag.y; drag.x = ev.clientX; drag.y = ev.clientY;
  rig.rotation.y -= dx * 0.004; pitch = Math.max(-1.45, Math.min(1.45, pitch - dy * 0.004)); camera.rotation.x = pitch;
});
cv.addEventListener('pointerup', (ev) => {
  if (!drag) return;
  const moved = Math.hypot(ev.clientX - drag.sx, ev.clientY - drag.sy); drag = null;
  if (moved > 6) return;
  const nd = new THREE.Vector2(ev.clientX / innerWidth * 2 - 1, -(ev.clientY / innerHeight) * 2 + 1);
  const rc = new THREE.Raycaster(); rc.setFromCamera(nd, camera);

addEventListener('keydown', (e) => { if (e.target.tagName !== 'INPUT') keys.add(e.key.toLowerCase()); if (e.key === 'Escape') select(-1); if (e.key === 'Delete' || e.key === 'Backspace') deleteSel(); if ((e.ctrlKey || e.metaKey) && e.key === 'z') undo(); });
addEventListener('keyup', (e) => keys.delete(e.key.toLowerCase()));

// ---------------------------------------------------------------- VR controllers
const panel3d = new THREE.Mesh(new THREE.PlaneGeometry(0.32, 0.32 * ui.cv.height / ui.cv.width), new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthTest: false }));
panel3d.renderOrder = 10;
const hands = {};
function makeHand(n) {
  const ctrl = renderer.xr.getController(n);
  const grip = renderer.xr.getControllerGrip(n);
  const lineGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3(0, 0, -1)]);
  const line = new THREE.Line(lineGeo, new THREE.LineBasicMaterial({ color: 0xff7a1a }));

makeHand(0); makeHand(1);
let grab = null;
const pressed = (h, b) => { const gp = h.source && h.source.gamepad; return !!(gp && gp.buttons[b] && gp.buttons[b].pressed); };

let snapReady = true;
function xrFrame(dt) {
  const R = hands.right, L = hands.left;
  const head = renderer.xr.getCamera();
  // left stick: walk relative to where you look
  if (L && L.source.gamepad) {
    const ax = L.source.gamepad.axes; const x = ax[2] || 0, y = ax[3] || 0;
    if (Math.abs(x) > 0.15 || Math.abs(y) > 0.15) {
      const f = new THREE.Vector3(); head.getWorldDirection(f); f.y = 0; f.normalize();
      const r = new THREE.Vector3().crossVectors(f, new THREE.Vector3(0, 1, 0));
      rig.position.addScaledVector(f, -y * 2 * dt).addScaledVector(r, x * 2 * dt);
    }
    if (edge(L, 5)) panel3d.visible = !panel3d.visible; // Y button
    if (edge(L, 4)) setDollhouse(!dollhouse);           // X button
  }
  if (R && R.source.gamepad) {
    const ax = R.source.gamepad.axes; const x = ax[2] || 0, y = ax[3] || 0;
    if (Math.abs(x) > 0.7 && snapReady) { // snap turn around the head
      const hp = new THREE.Vector3(); head.getWorldPosition(hp);
      const ang = -Math.sign(x) * Math.PI / 6;
      rig.position.sub(hp).applyAxisAngle(new THREE.Vector3(0, 1, 0), ang).add(hp); rig.rotation.y += ang; snapReady = false;
    }
    if (Math.abs(x) < 0.3) snapReady = true;
    if (Math.abs(y) > 0.3 && Math.abs(x) < 0.5) rig.position.y -= y * 1.5 * dt; // fly
    const pr = panelRay(R);
    const hoverId = pr && pr.region ? pr.region.id : null;
    if (hoverId !== ui.hover) { ui.hover = hoverId; drawUI(); }
    R.line.scale.z = pr ? pr.dist : 6;
    if (edge(R, 0)) {
      if (pr) { if (pr.region) pr.region.onClick(); }
      else {
        const m = R.ctrl.matrixWorld;
        select(pickRay(new THREE.Vector3().setFromMatrixPosition(m), new THREE.Vector3(0, 0, -1).transformDirection(m)));
      }
    }
    // grip: drag the selected element with the controller
    const g = pressed(R, 1); R.prev[1] = g;
    if (g && sel >= 0 && !grab && !fieldMode) { pushUndo(sel); grab = { start: R.ctrl.getWorldPosition(new THREE.Vector3()), off: E[sel].offset.clone() }; }
    if (g && grab && sel >= 0) {
      const now = R.ctrl.getWorldPosition(new THREE.Vector3());
      const d = now.sub(grab.start).divideScalar(world.scale.x);
      E[sel].offset.copy(grab.off).add(d); sync(sel);

}

function deskFrame(dt) {
  const sp = (keys.has('shift') ? 6 : 2.5) * dt;
  const f = new THREE.Vector3(-Math.sin(rig.rotation.y), 0, -Math.cos(rig.rotation.y));
  const r = new THREE.Vector3(Math.cos(rig.rotation.y), 0, -Math.sin(rig.rotation.y));
  if (keys.has('w') || keys.has('arrowup')) rig.position.addScaledVector(f, sp);
  if (keys.has('s') || keys.has('arrowdown')) rig.position.addScaledVector(f, -sp);
  if (keys.has('a') || keys.has('arrowleft')) rig.position.addScaledVector(r, -sp);
  if (keys.has('d') || keys.has('arrowright')) rig.position.addScaledVector(r, sp);
